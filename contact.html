<h2>Restaurant Review Request Form</h2>

<form>

    <label>Your Name:</label><br>
    <input type="text" name="name"><br><br>

    <label>Contact Details:</label><br>
    <input type="text" name="contact"><br><br>

    <label>Restaurant Name:</label><br>
    <input type="text" name="restaurant"><br><br>

    <label>Why do you want this review?</label><br>
    <textarea name="reason"></textarea><br><br>

    <label>Type of Restaurant:</label><br>
    <select name="type">
        <option>Traditional</option>
        <option>Fast Food</option>
        <option>Café</option>
        <option>Restaurant</option>
    </select><br><br>

    <label>Urgency:</label><br>
    <input type="radio" name="urgency" value="low"> Low<br>
    <input type="radio" name="urgency" value="medium"> Medium<br>
    <input type="radio" name="urgency" value="high"> High<br><br>

    <input type="submit" value="Submit Request">

</form>

<h2>Restaurant Ratings Table</h2>

<table border="1">

    <tr>
        <th colspan="3">Restaurant Ratings</th>
    </tr>

    <tr>
        <th rowspan="3">Restaurant</th>
        <th>Food Quality</th>
        <th>Service</th>
    </tr>

    <tr>
        <td>Excellent</td>
        <td>Good</td>
    </tr>

    <tr>
        <td>Very Good</td>
        <td>Average</td>
    </tr>

</table>

</body>
</html>
